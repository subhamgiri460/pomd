name: NSE Pre-Open Data Archiver

on:
  schedule:
    - cron: "38 3 * * *"  

  # Manual trigger only
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write    # Needed to push files via API

jobs:
  # ── Gate: all tests must pass before archiving ──────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -v --tb=short
        env:
          PYTHONUNBUFFERED: '1'

  # ── Archive: runs only after tests pass ─────────────────────────────────
  archive:
    name: Fetch & Archive NSE Pre-Open Data
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPO: ${{ github.repository }}
      TARGET_GITHUB_TOKEN: ${{ secrets.TARGET_GITHUB_TOKEN }}
      TARGET_GITHUB_REPO: ${{ secrets.TARGET_GITHUB_REPO }}
      GITHUB_BRANCH: main
      PYTHONUNBUFFERED: '1'    # Ensure logs stream in real-time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify curl is available
        run: curl --version | head -1

      - name: Run archiver pipeline
        run: python -m src.main
        env:
          # Override for debug mode if requested
          LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'DEBUG' || 'INFO' }}

      - name: Upload logs as artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: '*.log'
          retention-days: 7
